<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Crypto</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adsgram.ai/sdk/v1/adsgram.js"></script>
    <style>
        body { margin: 0; background-color: #1a0b2e; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .balance-card { background: #3d1466; border-radius: 24px; padding: 30px; margin-bottom: 40px; text-align: center; }
        .btn-earn { background: #7c3aed; color: white; border: none; border-radius: 18px; padding: 20px 40px; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="balance-card">
        <div>Ваш Баланс</div>
        <div id="balance">0</div>
    </div>
    <button class="btn-earn" id="watchAdBtn">Смотреть рекламу</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        // Инициализация AdsGram с твоим ID
        const AdController = window.AdsGram.init({ blockId: "37661" });

        document.getElementById('watchAdBtn').addEventListener('click', () => {
            AdController.show().then((result) => {
                tg.showAlert("Реклама просмотрена!");
                // Здесь будет логика начисления монет
            }).catch((err) => {
                tg.showAlert("Ошибка или реклама закрыта");
            });
        });
    </script>
</body>
</html>
